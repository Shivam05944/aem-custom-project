<div data-sly-use.multifield="com.custom.core.models.MultiField" class="component">
    <div class="form-list">
        <div data-sly-list="${multifield.form}">
            <div class="form-item-image" data-sly-test="${item.fileReference}">
                <img src="${item.fileReference}"/>
                <h1>${item.name}</h1>
                <p>${item.description}</p>
            </div>
        </div>
    </div>
</div>
